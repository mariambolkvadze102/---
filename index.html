<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кидбург - Ресторан</title>
    <!-- Подключаем красивые шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- БАЗОВЫЕ СТИЛИ (Светлая тема в стиле меню) --- */
        :root {
            --bg-color: #f9f5ed;          /* Кремовый фон */
            --panel-bg: #ffffff;          /* Белые карточки */
            --accent-color: #9e7b56;      /* Теплый коричневый */
            --accent-hover: #b8956e;      /* Светло-коричневый */
            --text-color: #4a3b2e;        /* Темно-коричневый текст */
            --text-muted: #8c7a6b;        /* Приглушенный текст */
            --border-color: #dcd0c0;      /* Цвет линий */
            --success-color: #6b8e23;     /* Оливковый для кнопки "Оформить" */
            --danger-color: #c0392b;      /* Красный для удаления */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Lato', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#e5dac9 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1, h2, h3, .main-title, .category-title {
            font-family: 'Playfair Display', serif;
        }

        /* --- ЭКРАНЫ --- */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ЭКРАН 1: ГЛАВНАЯ --- */
        #screen-main {
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .main-title {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-color);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .btn-large {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(158, 123, 86, 0.3);
            width: 300px;
            text-align: center;
            font-family: 'Lato', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-large:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: var(--accent-color);
            color: white;
        }

        /* --- ЭКРАН 2: ВЫБОР СТОЛИКА --- */
        #screen-tables {
            align-items: center;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin-top: 30px;
        }

        .table-btn {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 20px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        .table-btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* --- ЭКРАН 3: МЕНЮ --- */
        #screen-menu {
            padding-bottom: 90px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-content {
            overflow-y: auto;
            flex: 1;
            padding-right: 10px;
        }

        .category-title {
            font-size: 1.8rem;
            color: var(--text-color);
            margin: 40px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            position: relative;
        }
        
        .category-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background-color: var(--accent-color);
            margin: 10px auto 0;
        }

        .dish-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px dashed var(--border-color);
            cursor: pointer;
            transition: 0.2s;
            background-color: transparent;
        }

        .dish-item:hover {
            background-color: #fffbf5;
        }

        .dish-info {
            display: flex;
            flex-direction: column;
        }

        .dish-name {
            font-weight: 700;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            color: var(--text-color);
        }

        .dish-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            max-width: 600px;
            font-family: 'Lato', sans-serif;
        }

        .dish-price {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 1.2rem;
            white-space: nowrap;
            margin-left: 20px;
            font-family: 'Playfair Display', serif;
        }

        /* --- ЭКРАН 4: ИСТОРИЯ ЗАКАЗОВ --- */
        #screen-history {
            padding: 20px;
        }

        .history-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .btn-clear-all {
            background-color: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-clear-all:hover {
            background-color: var(--danger-color);
            color: white;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .history-card {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.2s;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .history-card-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            padding-right: 30px;
            font-family: 'Playfair Display', serif;
        }

        .history-card-table {
            color: var(--accent-color);
        }

        .history-card-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Lato', sans-serif;
        }

        .delete-order-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #ccc;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 5px;
            transition: 0.2s;
            border-radius: 5px;
        }

        .delete-order-btn:hover {
            color: var(--danger-color);
            background-color: rgba(192, 57, 43, 0.1);
        }

        .history-card-items {
            font-size: 0.9rem;
            flex: 1;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-card-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .history-card-note {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-style: italic;
            margin-left: 10px;
        }

        .history-card-total {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: right;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            color: var(--accent-color);
            font-family: 'Playfair Display', serif;
        }

        /* --- КОРЗИНА --- */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            border-top: 1px solid var(--border-color);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .cart-bar.visible {
            transform: translateY(0);
        }

        .cart-info {
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .cart-info span {
            color: var(--accent-color);
            font-weight: bold;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
        }

        .btn-view {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-view:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-checkout {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-checkout:hover {
            opacity: 0.9;
        }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(74, 59, 46, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-color);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--text-color);
            font-family: 'Playfair Display', serif;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--danger-color);
        }

        .order-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
        }

        .order-item {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .order-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .order-item-name {
            font-weight: bold;
            font-size: 1.1rem;
            flex: 1;
            font-family: 'Playfair Display', serif;
        }

        .order-item-price {
            color: var(--accent-color);
            font-weight: bold;
            margin-left: 10px;
            font-family: 'Playfair Display', serif;
        }

        .order-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .qty-btn {
            background: #eaddcd;
            border: none;
            color: var(--text-color);
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qty-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .qty-display {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .note-input {
            width: 100%;
            background: #fdfbf7;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .note-input:focus {
            border-color: var(--accent-color);
        }

        .note-input::placeholder {
            color: #b0a090;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .modal-total {
            font-size: 1.3rem;
            font-weight: bold;
            font-family: 'Playfair Display', serif;
        }

        .modal-total span {
            color: var(--accent-color);
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .tables-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .dish-desc {
                display: none;
            }
            .main-title {
                font-size: 2rem;
            }
            .cart-bar {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
            .cart-actions {
                width: 100%;
            }
            .btn-view, .btn-checkout {
                flex: 1;
                text-align: center;
            }
            .modal-content {
                width: 95%;
                padding: 15px;
            }
            .history-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-main" class="screen active">
        <h1 class="main-title">Добро пожаловать<br>в Ресторан</h1>
        <button class="btn-large" onclick="startOrder()">Новый заказ</button>
        <button class="btn-large btn-secondary" onclick="showHistory()">Заказы</button>
    </div>

    <!-- ЭКРАН 2: ВЫБОР СТОЛИКА -->
    <div id="screen-tables" class="screen">
        <h2 style="color: var(--accent-color); margin-bottom: 10px; font-family: 'Playfair Display', serif; font-size: 2rem;">Выберите столик</h2>
        <p style="color: var(--text-muted); font-size: 1.1rem;">Доступно 28 столиков</p>
        <div class="tables-grid" id="tables-container"></div>
    </div>

    <!-- ЭКРАН 3: МЕНЮ -->
    <div id="screen-menu" class="screen">
        <div class="menu-header">
            <button class="back-btn" onclick="goToTables()">← Назад к столикам</button>
            <div style="font-family: 'Playfair Display', serif;">Столик: <span id="current-table-display" style="color: var(--accent-color); font-weight: bold; font-size: 1.2rem;">-</span></div>
        </div>
        <div class="menu-content" id="menu-container"></div>
    </div>

    <!-- ЭКРАН 4: ИСТОРИЯ ЗАКАЗОВ -->
    <div id="screen-history" class="screen">
        <div class="menu-header">
            <button class="back-btn" onclick="showScreen('screen-main')">← На главную</button>
            <h2 style="color: var(--text-color); font-family: 'Playfair Display', serif;">История заказов</h2>
            <div style="width: 150px;"></div>
        </div>
        
        <div class="history-controls">
            <button class="btn-clear-all" onclick="clearAllHistory()">🗑 Очистить всю историю</button>
        </div>

        <div class="history-grid" id="history-container"></div>
    </div>

    <!-- ПАНЕЛЬ КОРЗИНЫ -->
    <div class="cart-bar" id="cart-bar">
        <div class="cart-info">
            Товаров: <span id="cart-count">0</span> | Сумма: <span id="cart-total">0</span> ₽
        </div>
        <div class="cart-actions">
            <button class="btn-view" onclick="openOrderModal()">Посмотреть заказ</button>
            <button class="btn-checkout" onclick="checkout()">Оформить</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЗАКАЗА -->
    <div class="modal-overlay" id="order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Ваш заказ (Столик <span id="modal-table-num"></span>)</div>
                <button class="close-btn" onclick="closeOrderModal()">&times;</button>
            </div>
            <div class="order-list" id="order-list-container"></div>
            <div class="modal-footer">
                <div class="modal-total">Итого: <span id="modal-total-price">0</span> ₽</div>
                <button class="btn-checkout" onclick="checkout()">Подтвердить</button>
            </div>
        </div>
    </div>

    <script>
        // --- ОБНОВЛЕННЫЕ ДАННЫЕ МЕНЮ (Добавлены СТРИТ-ФУД и ГОРЯЧИЕ БЛЮДА) ---

                { name: "Пепперони", price: 700, desc: "" },
                { name: "Ветчина и грибы", price: 700, desc: "" },
                { name: "4 сыра", price: 750, desc: "" },
                { name: "Мясная", price: 750, desc: "" },
                { name: "Куриная с соусом песто", price: 700, desc: "" },
                { name: "Креветки и руккола", price: 1250, desc: "" },
                { name: "Цезарь", price: 700, desc: "" },
                { name: "Пицца с фрикадельками", price: 750, desc: "" }
            ]},
            { category: "ПАСТА", items: [
                { name: "Лазанья", price: 590, desc: "" },
                { name: "Феттучини с лососем и шпинатом в сливочном соусе", price: 820, desc: "" },
                { name: "Феттучини болоньезе", price: 520, desc: "" },
                { name: "Паста аль песто", price: 680, desc: "" },
                { name: "Качо э пепе", price: 520, desc: "сливочное масло, пармезан, черный перец" },
                { name: "Карбонара", price: 740, desc: "" },
                { name: "Паста с белыми грибами и курицей", price: 740, desc: "" },
                { name: "Паста с томатами, страчателлой и базиликом", price: 520, desc: "" }
            ]},
            { category: "ГОРЯЧИЕ БЛЮДА", items: [
                { name: "Филе-миньон с белыми грибами и шампиньонами в сливочном соусе", price: 1350, desc: "" },
                { name: "Жареная форель с брокколи, помидорами черри и сливочным соусом", price: 1100, desc: "" },
                { name: "Куриное филе в панировке по-милански с картофельным пюре", price: 600, desc: "" },
                { name: "Жареное филе индейки в соусе терияки с овощами гриль", price: 730, desc: "" },
                { name: "Рубленый стейк, руккола, чеддер, пармезан", price: 890, desc: "" },
                // Новые блюда из фото
                { name: "Котлета куриная с картофельным пюре", price: 490, desc: "" },
                { name: "Мамины пельмешки", price: 390, desc: "" },
                { name: "Шашлычок куриный детский", price: 400, desc: "" }
            ]},
            { category: "ДЕСЕРТЫ", items: [
                { name: "Тирамису", price: 460, desc: "" },
                { name: "Панна-котта", price: 310, desc: "" },
                { name: "Шоколадный фондан с мороженым на выбор", price: 490, desc: "" },
                { name: "Яблочный штрудель с мороженым на выбор", price: 490, desc: "" },
                { name: "Мороженое мяки", price: 180, desc: "" }
            ]}
        ];

        // --- ЛОГИКА ---
        let currentTable = null;
        let cart = {}; 
        let orderHistory = JSON.parse(localStorage.getItem('restaurantOrders')) || [];

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if(screenId === 'screen-history') {
                renderHistory();
            }
        }

        function startOrder() {
            renderTables();
            showScreen('screen-tables');
        }

        function goToTables() {
            showScreen('screen-tables');
        }

        function renderTables() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';
            for (let i = 1; i <= 28; i++) {
                const btn = document.createElement('button');
                btn.className = 'table-btn';
                btn.textContent = i;
                btn.onclick = () => selectTable(i);
                container.appendChild(btn);
            }
        }

        function selectTable(num) {
            currentTable = num;
            document.getElementById('current-table-display').textContent = num;
            document.getElementById('modal-table-num').textContent = num;
            renderMenu();
            updateCartUI();
            showScreen('screen-menu');
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            menuData.forEach(cat => {
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.textContent = cat.category;
                container.appendChild(catTitle);

                cat.items.forEach(item => {
                    const dishDiv = document.createElement('div');
                    dishDiv.className = 'dish-item';
                    dishDiv.onclick = () => addToCart(item.name, item.price);
                    dishDiv.innerHTML = `
                        <div class="dish-info">
                            <div class="dish-name">${item.name}</div>
                            ${item.desc ? `<div class="dish-desc">${item.desc}</div>` : ''}
                        </div>
                        <div class="dish-price">${item.price} ₽</div>
                    `;
                    container.appendChild(dishDiv);
                });
            });
        }

        // --- КОРЗИНА ---
        function addToCart(name, price) {
            if (cart[name]) {
                cart[name].qty++;
            } else {
                cart[name] = { price: price, qty: 1, note: "" };
            }
            updateCartUI();
            
            const cartBar = document.getElementById('cart-bar');
            cartBar.style.backgroundColor = '#fff5e6';
            setTimeout(() => cartBar.style.backgroundColor = '', 150);

            if (document.getElementById('order-modal').classList.contains('active')) {
                renderOrderModal();
            }
        }

        function updateCartUI() {
            let count = 0;
            let total = 0;
            for (let key in cart) {
                count += cart[key].qty;
                total += cart[key].price * cart[key].qty;
            }
            document.getElementById('cart-count').textContent = count;
            document.getElementById('cart-total').textContent = total;
            const cartBar = document.getElementById('cart-bar');
            if (count > 0) cartBar.classList.add('visible');
            else cartBar.classList.remove('visible');
        }

        function openOrderModal() {
            renderOrderModal();
            document.getElementById('order-modal').classList.add('active');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.remove('active');
        }

        function renderOrderModal() {
            const container = document.getElementById('order-list-container');
            container.innerHTML = '';
            let total = 0;

            if (Object.keys(cart).length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#8c7a6b; margin-top:20px;">Корзина пуста</p>';
                document.getElementById('modal-total-price').textContent = '0';
                return;
            }

            for (let name in cart) {
                const item = cart[name];
                const itemTotal = item.price * item.qty;
                total += itemTotal;

                const div = document.createElement('div');
                div.className = 'order-item';
                div.innerHTML = `
                    <div class="order-item-header">
                        <div class="order-item-name">${name}</div>
                        <div class="order-item-price">${itemTotal} ₽</div>
                    </div>
                    <div class="order-item-controls">
                        <button class="qty-btn" onclick="changeQty('${name}', -1)">-</button>
                        <div class="qty-display">${item.qty}</div>
                        <button class="qty-btn" onclick="changeQty('${name}', 1)">+</button>
                        <button class="qty-btn" style="background:var(--danger-color); color:white; margin-left:auto;" onclick="removeItem('${name}')">×</button>
                    </div>
                    <input type="text" class="note-input" placeholder="Заметка (например: без лука)" 
                           value="${item.note}" 
                           onchange="updateNote('${name}', this.value)">
                `;
                container.appendChild(div);
            }
            document.getElementById('modal-total-price').textContent = total;
        }

        function changeQty(name, delta) {
            if (cart[name]) {
                cart[name].qty += delta;
                if (cart[name].qty <= 0) delete cart[name];
                updateCartUI();
                renderOrderModal();
            }
        }

        function removeItem(name) {
            delete cart[name];
            updateCartUI();
            renderOrderModal();
        }

        function updateNote(name, value) {
            if (cart[name]) cart[name].note = value;
        }

        // --- ОФОРМЛЕНИЕ ---
        function checkout() {
            if (Object.keys(cart).length === 0) {
                alert("Корзина пуста!");
                return;
            }
            
            let total = 0;
            let itemsList = [];
            
            for (let key in cart) {
                const item = cart[key];
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                itemsList.push({
                    name: key,
                    qty: item.qty,
                    price: item.price,
                    note: item.note
                });
            }

            const newOrder = {
                id: Date.now(),
                table: currentTable,
                date: new Date().toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
                items: itemsList,
                total: total
            };

            orderHistory.unshift(newOrder);
            localStorage.setItem('restaurantOrders', JSON.stringify(orderHistory));

            alert(`Заказ для столика №${currentTable} успешно оформлен!\nИтоговая сумма: ${total} ₽`);
            
            cart = {};
            updateCartUI();
            closeOrderModal();
            showScreen('screen-main');
            currentTable = null;
        }

        // --- ИСТОРИЯ ЗАКАЗОВ ---
        function showHistory() {
            renderHistory();
            showScreen('screen-history');
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            if (orderHistory.length === 0) {
                container.innerHTML = '<p style="color: #8c7a6b; grid-column: 1/-1; text-align: center; margin-top: 50px;">История заказов пуста</p>';
                return;
            }

            orderHistory.forEach(order => {
                const card = document.createElement('div');
                card.className = 'history-card';
                
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="history-card-item">
                            <span>${item.name} x${item.qty}</span>
                            <span>${item.price * item.qty} ₽</span>
                        </div>
                    `;
                    if (item.note) {
                        itemsHtml += `<div class="history-card-note">📝 ${item.note}</div>`;
                    }
                });

                card.innerHTML = `
                    <button class="delete-order-btn" onclick="deleteOrder(${order.id})" title="Удалить заказ">×</button>
                    <div class="history-card-header">
                        <span class="history-card-table">Столик №${order.table}</span>
                        <span class="history-card-date">${order.date}</span>
                    </div>
                    <div class="history-card-items">
                        ${itemsHtml}
                    </div>
                    <div class="history-card-total">
                        Итого: ${order.total} ₽
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteOrder(id) {
            if (!confirm('Вы уверены, что хотите удалить этот заказ из истории?')) return;
            
            orderHistory = orderHistory.filter(order => order.id !== id);
            localStorage.setItem('restaurantOrders', JSON.stringify(orderHistory));
            renderHistory();
        }

        function clearAllHistory() {
            if (orderHistory.length === 0) {
                alert('История уже пуста.');
                return;
            }
            if (!confirm('Вы уверены, что хотите удалить ВСЮ историю заказов? Это действие нельзя отменить.')) return;
            
            orderHistory = [];
            localStorage.setItem('restaurantOrders', JSON.stringify(orderHistory));
            renderHistory();
        }
    </script>
</body>
</html>
